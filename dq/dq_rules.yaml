version: 1
rules:
  - rule_id: DQ_RUN_ID_REQUIRED
    name: run_id_required
    description: run_id must be present and non-empty
    severity: CRITICAL
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_RECORD_HASH_REQUIRED
    name: record_hash_required
    description: record_hash must be present and non-empty
    severity: CRITICAL
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_PROMPT_ID_REQUIRED
    name: prompt_id_required
    description: prompt_id must be present and non-empty
    severity: HIGH
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_QUERY_TEXT_REQUIRED
    name: query_text_required
    description: query_text must be present and non-empty
    severity: HIGH
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_EVALUATED_STEP_INDEX_VALID
    name: evaluated_step_index_valid
    description: evaluated_step_index must be non-null and >= 0
    severity: HIGH
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_FINAL_OVERALL_LABEL_ALLOWED
    name: final_overall_label_allowed
    description: final_overall_label must be one of allowed labels
    severity: HIGH
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true

  - rule_id: DQ_METRIC_RANGE_0_5
    name: metric_range_0_5
    description: resolved metric fields must be in range [0, 5]
    severity: HIGH
    target_table: feedback_step
    logic_reference: src/silver/silver_transform_dataproc.py::apply_dq
    owner: data-platform
    enabled: true
