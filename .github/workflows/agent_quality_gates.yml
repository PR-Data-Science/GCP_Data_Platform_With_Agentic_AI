name: agent-quality-gates

on:
  pull_request:
    paths:
      - src/agent_service/**
      - tests/test_agent_*.py
      - .github/workflows/agent_quality_gates.yml
  push:
    branches: [ main ]
    paths:
      - src/agent_service/**
      - tests/test_agent_*.py

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run agent tests and regression gates
        run: |
          python -m pytest tests/test_agent_service.py tests/test_agent_tools.py tests/test_agent_retrieval.py tests/test_agent_eval.py tests/test_agent_security.py -v
